services:
  redis:
    image: redis:7-alpine
    container_name: context-pipe-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - context-pipe

  postgres:
    image: postgres:16-alpine
    container_name: context-pipe-postgres
    environment:
      POSTGRES_USER: context_pipe_test
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: context_pipe_test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - context-pipe

volumes:
  redis_data:
  postgres_data:

networks:
  context-pipe:
    driver: bridge
