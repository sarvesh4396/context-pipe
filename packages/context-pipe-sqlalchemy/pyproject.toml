[project]
name = "context-pipe-sqlalchemy"
version = "0.1.0"
description = "SQLAlchemy backend for context-pipe"
authors = [
    { name = "Sarvesh Kr. Dwivedi", email = "heysarvesh@pm.me" }
]
requires-python = ">=3.11"
dependencies = [
    "context-pipe==0.1.0",
    "aiosqlite>=0.22.1",
    "sqlalchemy[asyncio]>=2.0.49",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"
